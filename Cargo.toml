[package]
name = "sked"
description = "utilities pack for pentest"
authors = ["Nawasan <nawasan.dev@gmail.com>"]
license = "GPL-3.0-only"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/ZocketZero/sked"
readme = "README.md"
categories = ["command-line-utilities"]
default-run = "sked"

include = ["src/", "LICENSE"]

[[bin]]
name = "btc"
path = "./src/bin/btc.rs"
required-features = ["bitcoin"]

[dependencies]
anyhow = "1.0.100"
btc-wallet = "0.0.1"
clap = { version = "4.5.56", features = ["derive"] }
clap_complete = "4.5.65"
colored = "3.1.1"
regex = "1.12.2"
reqwest = "0.13.1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-test = "0.4.5"

[features]
default = ["public", "sum", "brute-path", "completions", "bitcoin"]
public = []
sum = []
brute-path = []
completions = []
bitcoin = []
