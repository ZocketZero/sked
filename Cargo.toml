[package]
name = "sked"
description = "utilities pack for pentest"
authors = ["Nawasan <nawasan.dev@gmail.com>"]
license = "GPL-3.0-only"
version = "0.4.3"
edition = "2024"
repository = "https://github.com/ZocketZero/sked"
readme = "README.md"
categories = ["command-line-utilities"]
default-run = "sked"

build = "src/build.rs"
include = ["src/", "LICENSE"]

[dependencies]
anyhow = "1.0.101"
btc-wallet = "0.2.0"
clap = { version = "4.5.57", features = ["derive"] }
clap_complete = "4.5.65"
clap_complete_nushell = "4.6.0"
colored = "3.1.1"
regex = "1.12.3"
reqwest = "0.13.2"
tokio = { version = "1.49.0", features = ["full"] }
tokio-test = "0.4.5"

[features]
default = ["public", "sum", "brute-path", "completions", "bitcoin"]
public = []
sum = []
brute-path = []
completions = []
bitcoin = []

[profile.tiny]
inherits = "release"
opt-level = "z"
strip = true
panic = "abort"
lto = true
codegen-units = 1
